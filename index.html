<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142c39">
  <meta name="description" content="خطط رحلتك، أماكنك، صورك ومصاريفك في مكان واحد">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>رحلتي | مخطط السفر</title>
</head>
<body>
  <header class="topbar"><a class="brand" href="#home"><span class="brand-icon">✦</span> رحلتي</a><div class="header-actions"><button id="languageBtn" class="lang-btn" aria-label="Change language">English</button><button id="menuBtn" class="icon-btn" aria-label="القائمة">☰</button></div></header>
  <main>
    <section class="hero" id="home"><div class="hero-art"></div><div class="hero-content"><div class="eyebrow">مساحتك لكل رحلة</div><h1>كل تفاصيل السفر<br><em>بمكان واحد.</em></h1><p>رتّب أيامك، احفظ الأماكن اللي بتحبها، وأضف صورك وملاحظاتك براحتك.</p><button class="primary" id="newTripHero">+ أنشئ رحلة جديدة</button></div></section>
    <section class="container" id="tripsSection"><div class="section-heading"><div><span class="eyebrow dark">ابدأ من هون</span><h2>رحلاتي</h2></div><button class="outline" id="newTrip">+ رحلة جديدة</button></div><div id="trips" class="trip-grid"></div></section>
    <section class="container hidden" id="workspace"><div class="workspace-head"><button class="back" id="backBtn">→ جميع الرحلات</button><div class="workspace-title"><div><span id="tripDestination" class="eyebrow dark"></span><h2 id="tripTitle"></h2><p id="tripDates"></p></div><div class="workspace-actions"><button class="outline" id="editTrip">تعديل الرحلة</button><button class="outline" id="exportTrip">تصدير نسخة</button></div></div></div><div class="tabs" role="tablist"><button class="tab active" data-tab="days">الجدول</button><button class="tab" data-tab="places">الأماكن</button><button class="tab" data-tab="budget">المصاريف</button><button class="tab" data-tab="notes">الملاحظات</button></div><div id="tabContent"></div></section>
    <section class="container footer-note"><span>✦</span> الرحلات محفوظة على جهازك. خذ نسخة احتياطية من زر «تصدير نسخة».</section>
  </main>
  <nav class="bottom-nav"><button data-go="home">⌂<small>الرئيسية</small></button><button data-go="tripsSection">▦<small>رحلاتي</small></button><button id="importBtn">↥<small>استيراد</small></button></nav>
  <input id="importFile" type="file" accept="application/json" hidden>
  <dialog id="editor"><form id="editorForm" method="dialog"><div class="dialog-head"><h3 id="dialogTitle"></h3><button type="button" class="close" id="closeDialog" aria-label="إغلاق">×</button></div><div id="fields"></div><div class="dialog-actions"><button type="button" class="outline" id="cancelDialog">إلغاء</button><button type="submit" class="primary">حفظ</button></div></form></dialog>
  <script src="app.js" defer></script>
</body>
</html>
