name: Build Android APK
on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create Android wrapper
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/rahlati/planner android/app/src/main/assets
          cp index.html app.js style.css icon.svg manifest.webmanifest sw.js android/app/src/main/assets/
          sed -i "s/crypto.randomUUID()/((crypto.randomUUID?.() || String(Date.now())+Math.random()))/" android/app/src/main/assets/app.js
          cat > android/settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Rahlati'
          include ':app'
          GRADLE
          cat > android/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          GRADLE
          cat > android/app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.rahlati.planner'
            compileSdk 35
            defaultConfig { applicationId 'com.rahlati.planner'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
          }
          GRADLE
          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="رحلتي" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cat > android/app/src/main/java/com/rahlati/planner/MainActivity.java <<'JAVA'
          package com.rahlati.planner;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.content.Intent;
          import android.net.Uri;
          import android.view.View;
          import android.view.WindowManager;
          public class MainActivity extends Activity {
            WebView web; ValueCallback<Uri[]> pending; static final int PICK=42;
            @Override public void onCreate(Bundle b){super.onCreate(b);getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);web=new WebView(this);web.getSettings().setJavaScriptEnabled(true);web.getSettings().setDomStorageEnabled(true);web.getSettings().setAllowFileAccess(true);web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v,String url){if(url.startsWith("file:")||url.startsWith("#"))return false;startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url)));return true;}});web.setWebChromeClient(new WebChromeClient(){@Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> cb,FileChooserParams params){pending=cb;try{startActivityForResult(params.createIntent(),PICK);return true;}catch(Exception e){pending=null;return false;}}});setContentView(web);web.loadUrl("file:///android_asset/index.html");}
            @Override protected void onActivityResult(int request,int result,Intent data){super.onActivityResult(request,result,data);if(request==PICK&&pending!=null){pending.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result,data));pending=null;}}
            @Override public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
          }
          JAVA
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Rahlati-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
