name: Build free Istanbul and Bursa place index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Overture data client
        run: python -m pip install overturemaps==1.0.2
      - name: Extract city place indexes
        run: python build-overture-index.py
      - name: Publish index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/istanbul.json data/bursa.json
          if ! git diff --staged --quiet; then
            git commit -m "Add free Overture place index for Istanbul and Bursa"
            git push
          fi
