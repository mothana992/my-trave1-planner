<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدخول | رحلتي</title><style>
:root{font-family:Arial,sans-serif;color:#173942;background:#f8f7f3}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:white;border:1px solid #e1e8e3;border-radius:24px;padding:32px;box-shadow:0 18px 55px #17394218}.symbol{width:50px;height:50px;background:#d36a4b;color:white;border-radius:14px;display:grid;place-items:center;font-size:30px}h1{margin:20px 0 6px;font-size:30px}p{color:#657a7e;line-height:1.5}label{display:block;margin:18px 0;font-weight:700}input{width:100%;margin-top:8px;padding:13px;border:1px solid #cbd7d2;border-radius:11px;font:inherit}button{width:100%;padding:14px;background:#173942;border:0;color:white;border-radius:11px;font:700 16px Arial;cursor:pointer}button:disabled{opacity:.6}#error{min-height:22px;color:#b04b3b;font-weight:700}.hidden{display:none}
</style></head><body><main class="card"><div class="symbol">✦</div><h1 id="title">الدخول إلى رحلتي</h1><p id="hint">رحلاتك محفوظة بحسابك وتظهر على أجهزتك.</p><form id="form"><label>اسم المستخدم<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+"></label><label>كلمة السر<input name="password" type="password" autocomplete="current-password" required minlength="12"></label><label id="setup" class="hidden">رمز الإعداد الخاص<input name="setupToken" type="password" autocomplete="off"></label><p id="error" role="alert"></p><button id="submit">دخول</button></form></main><script>
let setup=false;fetch('/api/status',{cache:'no-store'}).then(r=>r.json()).then(v=>{setup=v.setupRequired;if(setup){document.getElementById('title').textContent='إعداد حساب الأدمن';document.getElementById('hint').textContent='اختار اسم المستخدم وكلمة سر قوية بنفسك. رمز الإعداد تحصل عليه من إعدادات الخادم، وما بينحفظ داخل التطبيق.';document.getElementById('setup').classList.remove('hidden');document.querySelector('[name=setupToken]').required=true;document.querySelector('[name=password]').autocomplete='new-password';document.getElementById('submit').textContent='إنشاء الحساب'}}).catch(()=>{document.getElementById('error').textContent='تعذّر الاتصال بالخادم'});
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();let form=e.target,button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{let data=Object.fromEntries(new FormData(form));let r=await fetch(setup?'/api/setup':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'});if(!r.ok){error.textContent=r.status===429?'محاولات كثيرة. جرّب بعد ربع ساعة.':setup?'تأكد من رمز الإعداد واسم المستخدم وكلمة السر.':'اسم المستخدم أو كلمة السر غير صحيحين.';return}location.replace('/')}catch{error.textContent='فشل الاتصال. جرّب مرة ثانية.'}finally{button.disabled=false}});
</script></body></html>
